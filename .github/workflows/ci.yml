name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (v1.5.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scopus-collaboration-deep-dive-v1.5.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scopus-collaboration-deep-dive-v1.5.0/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q scripts

      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/scopus-collaboration-deep-dive-v1.5.0
        run: pytest
